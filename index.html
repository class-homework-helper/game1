<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#c5efff">
<title>喵速小隊｜速率大冒險</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&family=Noto+Sans+TC:wght@500;700;900&display=swap');
:root{--ink:#173650;--blue:#42b8e8;--yellow:#ffd454;--pink:#ff8ba0}*{box-sizing:border-box}body{margin:0;background:#bcecff;color:var(--ink);font-family:'Nunito','Noto Sans TC',sans-serif;min-height:100vh;display:grid;place-items:center;padding:14px}.app{width:min(100%,1000px);}.top{display:flex;align-items:center;justify-content:space-between;margin:0 4px 12px}.brand{font-weight:900;font-size:clamp(20px,4vw,32px);letter-spacing:.02em}.brand small{display:block;font-size:13px;color:#46738b;letter-spacing:.12em}.stats{display:flex;gap:9px}.pill{background:#fff;border:2px solid #a5dced;border-radius:18px;padding:8px 13px;font-weight:900;box-shadow:0 3px 0 #8dc9df}.pill b{color:#ed9a13}.stage{position:relative;background:linear-gradient(#8edcf6 0%,#d4f5ff 62%,#e9f7d8 62%);border:4px solid white;border-radius:28px;overflow:hidden;box-shadow:0 12px 0 #75bdd5,0 20px 40px #3985a633}.stage:before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at 14% 24%,#ffffff99 0 7%,transparent 7.5%),radial-gradient(ellipse at 78% 17%,#ffffffaa 0 6%,transparent 6.5%);pointer-events:none}.hud{position:absolute;z-index:2;left:18px;top:14px;right:18px;display:flex;justify-content:space-between;font-weight:900}.hud span{background:#ffffffb8;padding:6px 12px;border-radius:99px}.canvas{display:block;width:100%;height:auto;aspect-ratio:16/7;touch-action:none}.ground{position:absolute;bottom:0;height:14px;background:#70c95c;width:100%;border-top:4px solid #a6e476}.start,.modal{position:absolute;inset:0;z-index:4;display:grid;place-items:center;background:#16365055;padding:18px}.card{background:white;border:4px solid #fff;border-radius:26px;padding:24px;max-width:440px;text-align:center;box-shadow:0 8px 0 #8acbe0;width:min(100%,430px)}.cat{font-size:56px;line-height:1.1}.card h1,.card h2{margin:8px 0;color:#19415b}.card p{line-height:1.75;margin:8px 0 18px;color:#537286}.btn{border:0;border-radius:16px;background:var(--yellow);color:#533c0a;font:900 18px inherit;padding:12px 24px;cursor:pointer;box-shadow:0 5px 0 #e2aa2d}.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #e2aa2d}.modal{z-index:5;background:#14364b88}.question{font-size:clamp(20px,4vw,27px);font-weight:900;line-height:1.55}.answers{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:18px 0}.answer{background:#e7f8ff;border:3px solid #bee9f7;border-radius:15px;padding:13px 8px;color:#19415b;font:900 18px inherit;cursor:pointer}.answer:hover{background:#c8f0ff}.feedback{min-height:26px;font-weight:900;color:#25865b}.hidden{display:none!important}.controls{display:flex;justify-content:center;gap:12px;margin:19px auto 0}.control{width:min(42vw,180px);border:0;border-radius:20px;padding:13px 16px;background:white;color:var(--ink);font:900 17px inherit;box-shadow:0 5px 0 #8dc9df;touch-action:none;cursor:pointer}.control span{font-size:24px;vertical-align:middle;margin-right:7px}.hint{text-align:center;color:#3e7189;font-size:13px;margin:12px 0}.footer{display:flex;justify-content:space-between;padding:0 4px;color:#46738b;font-size:12px}@media(max-width:600px){body{padding:10px}.top{align-items:flex-start}.stats{gap:5px}.pill{padding:7px 9px;font-size:13px}.canvas{aspect-ratio:4/3}.stage{border-radius:20px}.card{padding:19px}.controls{margin-top:14px}}
</style></head><body><main class="app"><header class="top"><div class="brand">🐾 喵速小隊 <small>速率大冒險</small></div><div class="stats"><div class="pill">🪙 <b id="coins">100</b></div><div class="pill">⭐ <b id="score">0</b></div></div></header>
<section class="stage"><div class="hud"><span>🏃 <span id="distance">0</span> m</span><span>⚡ Lv.<span id="level">1</span></span></div><canvas class="canvas" id="game" width="960" height="420" aria-label="貓咪跑酷遊戲"></canvas><div class="ground"></div>
<div class="start" id="start"><div class="card"><div class="cat">🐱</div><h1>準備出發！</h1><p>幫小貓越過障礙，回答速率問題賺金幣！<br>上鍵／空白鍵跳躍， 下鍵蹲低。<br>手機也能用下方按鈕操作喔。</p><button class="btn" id="startBtn">開始冒險</button></div></div>
<div class="modal hidden" id="quiz"><div class="card"><div class="cat">🧠</div><div class="question" id="question"></div><div class="answers" id="answers"></div><div class="feedback" id="feedback"></div></div></div>
<div class="modal hidden" id="end"><div class="card"><div class="cat">🐱🏁</div><h2>這趟跑得真棒！</h2><p id="summary"></p><button class="btn" id="restart">再跑一次</button></div></div>
</section><div class="controls"><button class="control" id="jump"><span>⬆️</span>跳高</button><button class="control" id="duck"><span>⬇️</span>蹲低</button></div><div class="hint">鍵盤 ↑ / 空白鍵 跳高　↓ 蹲低　·　遇到障礙答對 +20 金幣，答錯 −10 金幣</div><div class="footer"><span>用數學陪小貓跑更遠</span><span>速率＝距離 ÷ 時間</span></div></main>
<script>
const canvas=document.querySelector('#game'),ctx=canvas.getContext('2d'),$=s=>document.querySelector(s);let coins=100,score=0,distance=0,speed=5,playing=false,paused=false,obstacles=[],catY=0,vy=0,ducking=false,last=0,spawn=0,anim=0,asked=new Set();
const bank=[['小明騎車 2 小時走了 24 公里，平均每小時幾公里？','12 公里','10 公里','22 公里','48 公里',0],['小美 3 分鐘跑了 600 公尺，平均每分鐘跑幾公尺？','200 公尺','180 公尺','300 公尺','1,800 公尺',0],['時速 60 公里的汽車，2 小時行駛幾公里？','120 公里','30 公里','62 公里','100 公里',0],['一段 15 公里的路走了 3 小時，平均時速是多少？','5 公里','45 公里','12 公里','18 公里',0],['腳踏車每小時 12 公里，騎 30 分鐘可走多遠？','6 公里','12 公里','24 公里','3 公里',0],['小華 4 分鐘走 320 公尺，平均每分鐘走幾公尺？','80 公尺','40 公尺','128 公尺','320 公尺',0],['火車每小時 90 公里，行駛 3 小時共幾公里？','270 公里','30 公里','93 公里','180 公里',0],['跑步 1,200 公尺花 6 分鐘，平均每分鐘幾公尺？','200 公尺','720 公尺','120 公尺','1,206 公尺',0],['時速 4 公里的步行速度，走 2 小時是幾公里？','8 公里','2 公里','6 公里','4 公里',0],['距離 36 公里、時速 12 公里，要走幾小時？','3 小時','24 小時','48 小時','4 小時',0],['汽車 2 小時行駛 150 公里，平均時速是多少？','75 公里','70 公里','152 公里','300 公里',0],['小兔每分鐘跑 90 公尺，5 分鐘跑幾公尺？','450 公尺','95 公尺','18 公尺','500 公尺',0],['時速 72 公里的機車，1 小時 30 分鐘行駛幾公里？','108 公里','72 公里','144 公里','90 公里',0],['游泳 400 公尺花 8 分鐘，平均每分鐘游幾公尺？','50 公尺','40 公尺','32 公尺','408 公尺',0],['走 18 公里花 3 小時，平均時速幾公里？','6 公里','15 公里','21 公里','54 公里',0],['每分鐘走 70 公尺，走 10 分鐘共幾公尺？','700 公尺','80 公尺','7000 公尺','70 公尺',0]];
function draw(){ctx.clearRect(0,0,960,420);ctx.fillStyle='#ffffff88';[[120,80,32],[570,62,25],[820,98,38]].forEach(([x,y,r])=>{ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.arc(x+r,y+4,r*.7,0,Math.PI*2);ctx.fill()});ctx.fillStyle='#93d879';ctx.beginPath();ctx.ellipse(170,285,220,55,0,Math.PI,Math.PI*2);ctx.ellipse(730,280,260,65,0,Math.PI,Math.PI*2);ctx.fill();ctx.fillStyle='#f5d68b';ctx.fillRect(0,322,960,98);ctx.strokeStyle='#ddb96e';ctx.lineWidth=3;for(let x=0;x<960;x+=42){ctx.beginPath();ctx.moveTo(x,323);ctx.lineTo(x-30,420);ctx.stroke()}let h=ducking?54:85,w=ducking?78:75,y=322-h+catY;ctx.font=`${h}px serif`;ctx.textAlign='center';ctx.fillText('🐱',115,y+h*.83);obstacles.forEach(o=>{ctx.font='58px serif';ctx.fillText(o.type==='bird'?'🐦':o.type==='rock'?'🪨':'📦',o.x, o.type==='bird'?250:318)})}
function loop(t){if(!playing)return;let dt=Math.min((t-last)/16||1,2);last=t;if(!paused){distance+=speed*dt*.08;speed=Math.min(5+distance/220,11);spawn+=dt;if(spawn>Math.max(65,120-speed*5)&&obstacles.length<3){obstacles.push({x:1010,type:['bird','rock','box'][Math.floor(Math.random()*3)]});spawn=0}if(catY<0||vy<0){catY+=vy*dt;vy+=.65*dt;if(catY>0){catY=0;vy=0}}obstacles.forEach(o=>o.x-=speed*dt);if(obstacles.some(o=>o.x<155&&o.x>70&&((o.type==='bird'&&!ducking)||(o.type!=='bird'&&catY>-5)))){const o=obstacles.find(o=>o.x<155&&o.x>70&&((o.type==='bird'&&!ducking)||(o.type!=='bird'&&catY>-5)));if(o){obstacles=obstacles.filter(x=>x!==o);ask()}}obstacles=obstacles.filter(o=>o.x>-60);$('#distance').textContent=Math.floor(distance);$('#level').textContent=1+Math.floor(distance/150);$('#coins').textContent=coins;$('#score').textContent=score}draw();anim=requestAnimationFrame(loop)}
function jump(){if(playing&&!paused&&catY===0){vy=-13}}function duck(on){ducking=on}function ask(){paused=true;let idx;do{idx=Math.floor(Math.random()*bank.length)}while(asked.has(idx)&&asked.size<bank.length);asked.add(idx);if(asked.size===bank.length)asked.clear();let q=bank[idx];$('#question').textContent=q[0];let options=q.slice(1,5),correct=q[5];let order=[0,1,2,3].sort(()=>Math.random()-.5);$('#answers').innerHTML='';$('#feedback').textContent='';order.forEach(i=>{let b=document.createElement('button');b.className='answer';b.textContent=options[i];b.onclick=()=>{document.querySelectorAll('.answer').forEach(x=>x.disabled=true);if(i===correct){coins+=20;score+=100;$('#feedback').textContent='答對了！ +20 金幣 🎉';}else{coins=Math.max(0,coins-10);$('#feedback').textContent='再加油！ −10 金幣';}$('#coins').textContent=coins;$('#score').textContent=score;setTimeout(()=>{$('#quiz').classList.add('hidden');paused=false;last=performance.now()},900)};$('#answers').append(b)});$('#quiz').classList.remove('hidden')}
function start(){coins=100;score=0;distance=0;speed=5;obstacles=[];spawn=0;catY=0;vy=0;asked.clear();playing=true;paused=false;$('#start').classList.add('hidden');$('#end').classList.add('hidden');last=performance.now();cancelAnimationFrame(anim);loop(last)}function over(){playing=false;$('#summary').textContent=`跑了 ${Math.floor(distance)} 公尺，答題得分 ${score} 分，帶回 ${coins} 枚金幣！`;$('#end').classList.remove('hidden')}
document.addEventListener('keydown',e=>{if(e.code==='ArrowUp'||e.code==='Space'){e.preventDefault();jump()}if(e.code==='ArrowDown'){e.preventDefault();duck(true)}});document.addEventListener('keyup',e=>{if(e.code==='ArrowDown')duck(false)});$('#jump').addEventListener('pointerdown',jump);$('#duck').addEventListener('pointerdown',()=>duck(true));['pointerup','pointerleave','pointercancel'].forEach(e=>$('#duck').addEventListener(e,()=>duck(false)));$('#startBtn').onclick=start;$('#restart').onclick=start;
let frameCount=0;const baseLoop=loop;function loop(t){if(!playing)return;let dt=Math.min((t-last)/16||1,2);last=t;if(!paused){distance+=speed*dt*.08;speed=Math.min(5+distance/220,11);spawn+=dt;if(spawn>Math.max(65,120-speed*5)&&obstacles.length<3){obstacles.push({x:1010,type:['bird','rock','box'][Math.floor(Math.random()*3)]});spawn=0}if(catY<0||vy<0){catY+=vy*dt;vy+=.65*dt;if(catY>0){catY=0;vy=0}}obstacles.forEach(o=>o.x-=speed*dt);const hit=obstacles.find(o=>o.x<155&&o.x>70&&((o.type==='bird'&&!ducking)||(o.type!=='bird'&&catY>-5)));if(hit){obstacles=obstacles.filter(o=>o!==hit);ask()}obstacles=obstacles.filter(o=>o.x>-60);$('#distance').textContent=Math.floor(distance);$('#level').textContent=1+Math.floor(distance/150);$('#coins').textContent=coins;$('#score').textContent=score}draw();if(coins<=0){over();return}anim=requestAnimationFrame(loop)}draw();
</script></body></html>
